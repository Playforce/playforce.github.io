<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake mit verbesserten Partikeln</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg,#282c34,#3b3f47);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 30px;
        }

        #game {
            background: #111;
            border: 4px solid #555;
            margin-top: 20px;
        }

        #scoreboard {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }

        #controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            justify-content: center;
            max-width: 800px;
        }

        label {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            align-items: center;
            gap: 4px;
        }

        #startHint {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            opacity: 1;
            transition: opacity 0.5s;
        }

        #startHint.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div id="scoreboard">
        <div id="score">Score: 0</div>
        <div id="highscore">Highscore: 0</div>
        <div id="wins">Wins: 0</div>
    </div>

    <canvas id="game"></canvas>
    <div id="startHint">Drücke W / A / S / D oder eine Pfeiltaste um zu starten</div>
    <div id="pauseHint" style="margin-top:6px;font-size:14px;color:#aaa;opacity:0;transition:opacity 0.5s;">P drücken zum Pausieren</div>

    <div id="controls">
        <label>
            Geschwindigkeit
            <input type="range" id="speedControl" min="50" max="1000" value="100" step="50">
            <span id="speedValue">100</span>
        </label>
        <label>
            Schlangenfarbe
            <input type="color" id="snakeColorControl" value="#00ff99">
        </label>
        <label>
            Gradientfarbe (Schwanz)
            <input type="color" id="snakeTailColorControl" value="#005533">
        </label>
        <label>
            Wandkollision
            <input type="checkbox" id="wallControl" checked>
        </label>
        <label>
            Apfelfarbe
            <input type="color" id="appleColorControl" value="#ff3366">
        </label>
        <label>
            Apfelform
            <select id="appleShapeControl">
                <option value="heart">Herz</option>
                <option value="circle">Kreis</option>
                <option value="square">Quadrat</option>
                <option value="diamond">Diamant</option>
                <option value="star">Stern</option>
                <option value="triangle">Dreieck</option>
                <option value="hexagon" selected >Sechseck</option>
            </select>
        </label>
        <label>
            Anzahl Äpfel
            <input type="range" id="appleCountControl" min="1" max="10" value="1" step="1">
            <span id="appleCountValue">1</span>
        </label>
        <label>
            Hindernisse
            <input type="range" id="obstacleCountControl" min="0" max="20" value="0" step="1">
            <span id="obstacleCountValue">0</span>
        </label>
        <label>
            Hindernisse bewegen
            <input type="checkbox" id="obstaclesMoveControl">
        </label>
        <label>
            Hindernis-Geschwindigkeit
            <input type="range" id="obstaclespeedControl" min="500" max="10000" value="3000" step="500">
            <span id="obstacleSpeedValue">3000ms</span>
        </label>
        <label>
            Spielfeldgröße
            <select id="fieldSizeControl">
                <option value="360">Klein (18×18)</option>
                <option value="480">Mittel (24×24)</option>
                <option value="720" selected>Groß (36×36)</option>
                <option value="960">Sehr groß (48×48)</option>
            </select>
        </label>
        <label>
            Zufällige Schlangen-/Gradientfarbe
            <input type="checkbox" id="randomColorControl" checked>
        </label>
        <label>
            Verbindungslinie (rot)
            <input type="checkbox" id="connectionLineControl">
        </label>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        let tileCount;

        let snake, velocity, apples;
        let score, highscore, wins;
        let paused = false;
        let won = false;
        let lost = false;
        let gameStarted = false;

        let snakeColor, snakeTailColor, appleColor;
        let activeAppleShape, wallCollision, speed, appleCount, obstacleCount, obstaclesMove;
        let obstacles = [];
        let obstacleInterval = null;
        let obstacleSpeed = 3000;

        let randomColorEnabled = false;
        let showConnectionLine = false;

        let particles = [];

        const scoreEl = document.getElementById("score");
        const highscoreEl = document.getElementById("highscore");
        const winsEl = document.getElementById("wins");
        const startHint = document.getElementById("startHint");
        const pauseHint = document.getElementById("pauseHint");
        const speedControl = document.getElementById("speedControl");
        const speedValueEl = document.getElementById("speedValue");
        const snakeColorControl = document.getElementById("snakeColorControl");
        const snakeTailColorCtrl = document.getElementById("snakeTailColorControl");
        const appleColorControl = document.getElementById("appleColorControl");
        const appleShapeControl = document.getElementById("appleShapeControl");
        const appleCountControl = document.getElementById("appleCountControl");
        const appleCountValueEl = document.getElementById("appleCountValue");
        const wallControl = document.getElementById("wallControl");
        const fieldSizeControl = document.getElementById("fieldSizeControl");
        const obstacleCountControl = document.getElementById("obstacleCountControl");
        const obstacleCountValueEl = document.getElementById("obstacleCountValue");
        const obstaclesMoveControl = document.getElementById("obstaclesMoveControl");
        const obstacleSpeedControl = document.getElementById("obstaclespeedControl");
        const obstacleSpeedValueEl = document.getElementById("obstacleSpeedValue");
        const randomColorControl = document.getElementById("randomColorControl");
        const connectionLineControl = document.getElementById("connectionLineControl");

        function resizeCanvas() {
            const size = parseInt(fieldSizeControl.value);
            if(canvas.width !== size) {
                canvas.width = size;
                canvas.height = size;
                tileCount = size / gridSize;
            }
        }

        function init() {
            resizeCanvas();

            snakeColor = snakeColorControl.value;
            snakeTailColor = snakeTailColorCtrl.value;
            appleColor = appleColorControl.value;
            activeAppleShape = appleShapeControl.value;

            wallCollision = wallControl.checked;
            speed = parseInt(speedControl.value);
            appleCount = parseInt(appleCountControl.value);
            obstacleCount = parseInt(obstacleCountControl.value);
            obstaclesMove = obstaclesMoveControl.checked;
            obstacleSpeed = parseInt(obstacleSpeedControl.value);

            randomColorEnabled = randomColorControl.checked;
            showConnectionLine = connectionLineControl.checked;
            snakeColorControl.disabled = randomColorEnabled;
            snakeTailColorCtrl.disabled = randomColorEnabled;
            if (randomColorEnabled) {
                const [c1, c2] = generateDistinctColorPair();
                snakeColor = c1;
                snakeTailColor = c2;
            }

            score = 0;
            snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
            velocity = { x: 0, y: 0 };
            gameStarted = false;
            won = false;
            lost = false;
            paused = false;
            startHint.classList.remove("hidden");
            pauseHint.style.opacity = "0";

            highscore = parseInt(localStorage.getItem("snakeHighscore")) || 0;
            wins = parseInt(localStorage.getItem("snakeWins")) || 0;

            scoreEl.textContent = "Score: 0";
            highscoreEl.textContent = "Highscore: " + highscore;
            winsEl.textContent = "Wins: " + wins;

            obstacles = [];
            updateObstacleMax();
            for (let i = 0; i < obstacleCount; i++) spawnObstacle();

            apples = [];
            for (let i = 0; i < appleCount; i++) spawnApple();

            particles = [];
            startObstacleTimer();
        }

        function spawnObstacle() {
            const pos = getRandomPosition(true);
            if (pos) obstacles.push(pos);
        }

        function spawnApple() {
            const pos = getRandomPosition(false);
            if (!pos) return;
            const rand = Math.random();
            let type;
            if (rand < 0.005) type = "diamond"; // 0.005
            else if (rand < 0.00125) type = "purple"; // 0.00125
            else if (rand < 0.05625) type = "gold"; // 0.05625
            else type = "normal";
            apples.push({ ...pos, type });
        }

        function countBlockedNeighbors(x, y) {
            const dirs = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];
            let blocked = 0;
            dirs.forEach(d => {
                let nx = x + d.dx, ny = y + d.dy;
                if (wallCollision && (nx < 0 || nx >= tileCount || ny < 0 || ny >= tileCount)) {
                    blocked++;
                    return;
                }
                nx = (nx + tileCount) % tileCount;
                ny = (ny + tileCount) % tileCount;
                if (obstacles.some(o => o.x === nx && o.y === ny)) blocked++;
            });
            return blocked;
        }

        function getRandomPosition(isObstacle = false) {
            const free = [];
            const center = Math.floor(tileCount / 2);
            for (let x = 0; x < tileCount; x++) {
                for (let y = 0; y < tileCount; y++) {
                    if (snake.some(s => s.x === x && s.y === y)) continue;
                    if (apples.some(a => a.x === x && a.y === y)) continue;
                    if (obstacles.some(o => o.x === x && o.y === y)) continue;
                    if (isObstacle && Math.abs(x - center) < 3 && Math.abs(y - center) < 3) continue;
                    if (!isObstacle && countBlockedNeighbors(x, y) >= 3) continue;
                    free.push({ x, y });
                }
            }
            if (free.length === 0) return null;
            return free[Math.floor(Math.random() * free.length)];
        }

        // Dynamischer, weicherer Partikeleffekt skaliert nach Score-Wertigkeit
        function createParticles(x, y, color, scoreValue) {
            // Basis-Anzahl mal Faktor je nach Wertigkeit des Apfels
            let multiplier = 1;
            if(scoreValue === 5) multiplier = 2;       // Gold
            if(scoreValue === 10) multiplier = 4;    // Diamant 2.5
            if(scoreValue === 20) multiplier = 8;    // Lila Extra 3.5

            const count = Math.floor(12 * multiplier);
            const centerX = x * gridSize + gridSize / 2;
            const centerY = y * gridSize + gridSize / 2;

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                // Höhere Punktzahlen geben schnellere, größere Partikelspritzer
                const baseSpeed = (1 + Math.random() * 3) * (0.8 + multiplier * 0.2); 
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * baseSpeed,
                    vy: Math.sin(angle) * baseSpeed,
                    size: (1.5 + Math.random() * 2.5) * (0.9 + multiplier * 0.1),
                    alpha: 1,
                    decay: 0.015 + Math.random() * 0.02, // Etwas langsamer verblassen für weicheren Look
                    color: color
                });
            }
        }

        function handleParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96; // Luftwiderstand macht die Bewegung geschmeidiger
                p.vy *= 0.96;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let lastDrawTime = 0;

        function gameLoop(timestamp) {
            if (timestamp - lastDrawTime > speed) {
                update();
                lastDrawTime = timestamp;
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (paused || won || lost) return;
            if (velocity.x === 0 && velocity.y === 0) return;

            const head = {
                x: snake[0].x + velocity.x,
                y: snake[0].y + velocity.y
            };

            if (wallCollision) {
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameOver(); return;
                }
            } else {
                head.x = (head.x + tileCount) % tileCount;
                head.y = (head.y + tileCount) % tileCount;
            }

            if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }
            if (obstacles.some(o => o.x === head.x && o.y === head.y)) { gameOver(); return; }

            snake.unshift(head);

            let ate = false;
            for (let i = apples.length - 1; i >= 0; i--) {
                const a = apples[i];
                if (head.x === a.x && head.y === a.y) {
                    let currentAppleColor = appleColor;
                    let gainedScore = 1;

                    if (a.type === "diamond") {
                        gainedScore = 10;
                        currentAppleColor = "#44ccff";
                        for (let j = 0; j < 9; j++) {
                            const tail = snake[snake.length - 1];
                            snake.push({ x: tail.x, y: tail.y });
                        }
                    } else if (a.type === "purple") {
                        gainedScore = 20;
                        currentAppleColor = "#b347ff";
                        for (let j = 0; j < 19; j++) {
                            const tail = snake[snake.length - 1];
                            snake.push({ x: tail.x, y: tail.y });
                        }
                    } else if (a.type === "gold") {
                        gainedScore = 5;
                        currentAppleColor = "#FFD700";
                        for (let j = 0; j < 4; j++) {
                            const tail = snake[snake.length - 1];
                            snake.push({ x: tail.x, y: tail.y });
                        }
                    }

                    score += gainedScore;
                    createParticles(a.x, a.y, currentAppleColor, gainedScore);

                    apples.splice(i, 1);
                    spawnApple();
                    ate = true;
                }
            }

            if (!ate) snake.pop();

            scoreEl.textContent = "Score: " + score;
            if (score > highscore) {
                highscore = score;
                localStorage.setItem("snakeHighscore", highscore);
                highscoreEl.textContent = "Highscore: " + highscore;
            }

            if (apples.length === 0 && getRandomPosition(false) === null) {
                wins++;
                localStorage.setItem("snakeWins", wins);
                winsEl.textContent = "Wins: " + wins;
                won = true;
                paused = true;
            }
        }

        function startObstacleTimer() {
            if (obstacleInterval) clearInterval(obstacleInterval);
            obstacleInterval = null;
            if (obstaclesMove && obstacles.length > 0) {
                obstacleInterval = setInterval(() => {
                    if (!paused && !won && gameStarted) moveObstacles();
                }, obstacleSpeed);
            }
        }

        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            const toHex = x => Math.round(255 * x).toString(16).padStart(2, "0");
            return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
        }

        function generateDistinctColorPair() {
            const hue1 = Math.floor(Math.random() * 360);
            const hueOffset = 130 + Math.random() * 100;
            const hue2 = (hue1 + hueOffset) % 360;
            const color1 = hslToHex(hue1, 75 + Math.random() * 15, 50 + Math.random() * 10);
            const color2 = hslToHex(hue2, 75 + Math.random() * 15, 30 + Math.random() * 15);
            return [color1, color2];
        }

        function moveObstacles() {
            const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
            const nextHead = {
                x: (snake[0].x + velocity.x + tileCount) % tileCount,
                y: (snake[0].y + velocity.y + tileCount) % tileCount
            };

            for (let i = obstacles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [obstacles[i], obstacles[j]] = [obstacles[j], obstacles[i]];
            }
            obstacles.forEach(o => {
                const shuffled = dirs.slice().sort(() => Math.random() - 0.5);
                for (const d of shuffled) {
                    let nx = o.x + d.x;
                    let ny = o.y + d.y;
                    if (wallCollision) {
                        if (nx < 0 || nx >= tileCount || ny < 0 || ny >= tileCount) continue;
                    } else {
                        nx = (nx + tileCount) % tileCount;
                        ny = (ny + tileCount) % tileCount;
                    }
                    if (snake.some(s => s.x === nx && s.y === ny)) continue;
                    if (apples.some(a => a.x === nx && a.y === ny)) continue;
                    if (obstacles.some(ob => ob !== o && ob.x === nx && ob.y === ny)) continue;
                    if (nx === nextHead.x && ny === nextHead.y) continue;
                    o.x = nx;
                    o.y = ny;
                    break;
                }
            });

            apples.forEach(apple => {
                if (countBlockedNeighbors(apple.x, apple.y) >= 3) {
                    const newPos = getRandomPosition(false);
                    if (newPos) {
                        apple.x = newPos.x;
                        apple.y = newPos.y;
                    }
                }
            });
        }

        function hexToRgb(hex) {
            return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
        }
        function lerpColor(colorA, colorB, t) {
            const [r1, g1, b1] = hexToRgb(colorA);
            const [r2, g2, b2] = hexToRgb(colorB);
            return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
        }
        function lightenColor(hex, amount) {
            const [r, g, b] = hexToRgb(hex);
            return `rgb(${Math.min(255, Math.round(r + (255 - r) * amount))},${Math.min(255, Math.round(g + (255 - g) * amount))},${Math.min(255, Math.round(b + (255 - b) * amount))})`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid zeichnen
            ctx.strokeStyle = "#222";
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }

            // Snake zeichnen
            const len = snake.length;
            snake.forEach((seg, index) => {
                const isHead = index === 0;
                const t = len > 1 ? index / (len - 1) : 0;
                if (isHead) {
                    ctx.shadowColor = snakeColor;
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = lightenColor(snakeColor, 0.55);
                } else {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = lerpColor(snakeColor, snakeTailColor, t);
                }
                const radius = isHead ? gridSize / 2 - 1 : gridSize / 2 - 2;
                ctx.beginPath();
                ctx.arc(seg.x * gridSize + gridSize / 2, seg.y * gridSize + gridSize / 2, radius, 0, 2 * Math.PI);
                ctx.fill();

                if (isHead) {
                    ctx.shadowBlur = 0;
                    const cx = seg.x * gridSize + gridSize / 2;
                    const cy = seg.y * gridSize + gridSize / 2;
                    const spreadX = velocity.y !== 0 ? 4 : 0;
                    const spreadY = velocity.x !== 0 ? 4 : 0;
                    const fwdX = velocity.x * 4;
                    const fwdY = velocity.y * 4;
                    const eyes = (velocity.x === 0 && velocity.y === 0)
                        ? [{ x: cx + 3, y: cy - 3 }, { x: cx - 3, y: cy - 3 }]
                        : [{ x: cx + fwdX + spreadX, y: cy + fwdY + spreadY }, { x: cx + fwdX - spreadX, y: cy + fwdY - spreadY }];
                    eyes.forEach(eye => {
                        ctx.beginPath(); ctx.arc(eye.x, eye.y, 2.8, 0, 2 * Math.PI);
                        ctx.fillStyle = "white"; ctx.fill();
                        ctx.beginPath(); ctx.arc(eye.x + velocity.x * 0.8, eye.y + velocity.y * 0.8, 1.4, 0, 2 * Math.PI);
                        ctx.fillStyle = "#111"; ctx.fill();
                    });
                }
            });

            ctx.shadowBlur = 0;

            if (showConnectionLine && snake.length > 1) {
                ctx.strokeStyle = "red";
                ctx.lineWidth = 2;
                ctx.beginPath();
                snake.forEach((seg, idx) => {
                    const cx = seg.x * gridSize + gridSize / 2;
                    const cy = seg.y * gridSize + gridSize / 2;
                    if (idx === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
                });
                ctx.stroke();
            }

            // Apples zeichnen
            apples.forEach(apple => {
                const ax = apple.x * gridSize;
                const ay = apple.y * gridSize;
                if (apple.type === "diamond") {
                    ctx.fillStyle = "#44ccff";
                    ctx.shadowColor = "#44ccff";
                    ctx.shadowBlur = 25;
                    drawAppleShape(ax, ay);
                    ctx.shadowBlur = 0;
                    return;
                }
                if (apple.type === "purple") {
                    ctx.fillStyle = "#b347ff";
                    ctx.shadowColor = "#b347ff";
                    ctx.shadowBlur = 25;
                    drawAppleShape(ax, ay);
                    ctx.shadowBlur = 0;
                    return;
                }
                if (apple.type === "gold") {
                    ctx.fillStyle = "#FFD700";
                    ctx.shadowColor = "#FFD700";
                    ctx.shadowBlur = 20;
                } else {
                    ctx.fillStyle = appleColor;
                    ctx.shadowBlur = 0;
                }
                drawAppleShape(ax, ay);
                ctx.shadowBlur = 0;
            });

            // Obstacles zeichnen
            obstacles.forEach(o => {
                const ox = o.x * gridSize;
                const oy = o.y * gridSize;
                ctx.fillStyle = "#888";
                ctx.shadowColor = "#aaa";
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.roundRect(ox + 2, oy + 2, gridSize - 4, gridSize - 4, 3);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#555";
                ctx.fillRect(ox + gridSize / 2 - 1, oy + 4, 2, gridSize - 8);
                ctx.fillRect(ox + 4, oy + gridSize / 2 - 1, gridSize - 8, 2);
            });
            ctx.shadowBlur = 0;

            // Partikel rendern
            handleParticles();

            // Overlays zeichnen
            if (!gameStarted && !won && !lost) {
                ctx.fillStyle = "rgba(0,0,0,0.45)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 28px Segoe UI";
                ctx.textAlign = "center";
                ctx.fillText("W / A / S / D drücken zum Starten", canvas.width / 2, canvas.height / 2);
            }

            if (paused && !won && !lost) {
                ctx.fillStyle = "white";
                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("PAUSE", canvas.width / 2, canvas.height / 2);
            }

            if (won) {
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";
                ctx.fillStyle = "#FFD700";
                ctx.shadowColor = "#FFD700";
                ctx.shadowBlur = 30;
                ctx.font = "bold 52px Segoe UI";
                ctx.fillText("🎉 Gewonnen!", canvas.width / 2, canvas.height / 2 - 30);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "white";
                ctx.font = "24px Segoe UI";
                ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillStyle = "#aaa";
                ctx.font = "16px Segoe UI";
                ctx.fillText("Beliebige Taste drücken zum Neustart", canvas.width / 2, canvas.height / 2 + 55);
            }

            if (lost) {
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";
                ctx.fillStyle = "#ff4d4d";
                ctx.shadowColor = "#ff4d4d";
                ctx.shadowBlur = 30;
                ctx.font = "bold 52px Segoe UI";
                ctx.fillText("💀 Game Over", canvas.width / 2, canvas.height / 2 - 30);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "white";
                ctx.font = "24px Segoe UI";
                ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillStyle = "#aaa";
                ctx.font = "16px Segoe UI";
                ctx.fillText("Beliebige Taste drücken zum Neustart", canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        function drawAppleShape(ax, ay) {
            switch (activeAppleShape) {
                case "circle":
                    ctx.beginPath();
                    ctx.arc(ax + gridSize / 2, ay + gridSize / 2, gridSize / 2 - 4, 0, 2 * Math.PI);
                    ctx.fill(); break;
                case "square":
                    ctx.fillRect(ax + 4, ay + 4, gridSize - 8, gridSize - 8); break;
                case "diamond":
                    ctx.beginPath();
                    ctx.moveTo(ax + gridSize / 2, ay + 4);
                    ctx.lineTo(ax + gridSize - 4, ay + gridSize / 2);
                    ctx.lineTo(ax + gridSize / 2, ay + gridSize - 4);
                    ctx.lineTo(ax + 4, ay + gridSize / 2);
                    ctx.closePath(); ctx.fill(); break;
                case "triangle":
                    ctx.beginPath();
                    ctx.moveTo(ax + gridSize / 2, ay + 4);
                    ctx.lineTo(ax + gridSize - 4, ay + gridSize - 4);
                    ctx.lineTo(ax + 4, ay + gridSize - 4);
                    ctx.closePath(); ctx.fill(); break;
                case "hexagon": {
                    const cx = ax + gridSize / 2, cy = ay + gridSize / 2;
                    const r = gridSize / 2 - 3;
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = Math.PI / 180 * (60 * i - 90);
                        const px = cx + r * Math.cos(angle);
                        const py = cy + r * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath(); ctx.fill(); break;
                }
                case "star": {
                    const cx = ax + gridSize / 2, cy = ay + gridSize / 2;
                    const outer = gridSize / 2 - 4, inner = outer / 2;
                    let rot = Math.PI / 2 * 3;
                    ctx.beginPath(); ctx.moveTo(cx, cy - outer);
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer); rot += Math.PI / 5;
                        ctx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner); rot += Math.PI / 5;
                    }
                    ctx.lineTo(cx, cy - outer); ctx.closePath(); ctx.fill(); break;
                }
                default: {
                    const cx2 = ax + gridSize / 2, cy2 = ay + gridSize / 2, r = gridSize / 2 - 4;
                    ctx.beginPath();
                    ctx.moveTo(cx2, cy2 + r / 4);
                    ctx.bezierCurveTo(cx2 + r, cy2 - r / 2, cx2 + 2 * r, cy2 + r / 2, cx2, cy2 + 2 * r);
                    ctx.bezierCurveTo(cx2 - 2 * r, cy2 + r / 2, cx2 - r, cy2 - r / 2, cx2, cy2 + r / 4);
                    ctx.fill();
                }
            }
        }

        function gameOver() {
            lost = true;
            paused = true;
        }

        document.addEventListener("keydown", e => {
            const key = e.key.toLowerCase();
            if (won || lost) { init(); return; }
            if (key === "p") { paused = !paused; return; }
            if ((key === "arrowup" || key === "w") && velocity.y === 0) { velocity = { x: 0, y: -1 }; if (!gameStarted) { gameStarted = true; startHint.classList.add("hidden"); pauseHint.style.opacity = "1"; } }
            if ((key === "arrowdown" || key === "s") && velocity.y === 0) { velocity = { x: 0, y: 1 }; if (!gameStarted) { gameStarted = true; startHint.classList.add("hidden"); pauseHint.style.opacity = "1"; } }
            if ((key === "arrowleft" || key === "a") && velocity.x === 0) { velocity = { x: -1, y: 0 }; if (!gameStarted) { gameStarted = true; startHint.classList.add("hidden"); pauseHint.style.opacity = "1"; } }
            if ((key === "arrowright" || key === "d") && velocity.x === 0) { velocity = { x: 1, y: 0 }; if (!gameStarted) { gameStarted = true; startHint.classList.add("hidden"); pauseHint.style.opacity = "1"; } }
        });

        function updateObstacleMax() {
            const maxObstacles = Math.floor(tileCount * tileCount * 0.25);
            obstacleCountControl.max = maxObstacles;
            if (parseInt(obstacleCountControl.value) > maxObstacles) {
                obstacleCountControl.value = maxObstacles;
                obstacleCountValueEl.textContent = maxObstacles;
            }
        }

        // Dynamische Einstellungs-Updates ohne kompletten Spiel-Reset
        speedControl.addEventListener("input", () => { 
            speed = parseInt(speedControl.value); 
            speedValueEl.textContent = speed; 
        });
        snakeColorControl.addEventListener("input", () => { snakeColor = snakeColorControl.value; });
        snakeTailColorCtrl.addEventListener("input", () => { snakeTailColor = snakeTailColorCtrl.value; });
        appleColorControl.addEventListener("input", () => { appleColor = appleColorControl.value; });
        wallControl.addEventListener("change", () => { wallCollision = wallControl.checked; });
        appleShapeControl.addEventListener("change", () => { activeAppleShape = appleShapeControl.value; });
        
        appleCountControl.addEventListener("input", () => {
            appleCount = parseInt(appleCountControl.value);
            appleCountValueEl.textContent = appleCount;
            while(apples.length < appleCount) spawnApple();
            while(apples.length > appleCount) apples.pop();
        });
        
        obstacleCountControl.addEventListener("input", () => {
            obstacleCount = parseInt(obstacleCountControl.value);
            obstacleCountValueEl.textContent = obstacleCount;
            while(obstacles.length < obstacleCount) spawnObstacle();
            while(obstacles.length > obstacleCount) obstacles.pop();
        });

        obstaclesMoveControl.addEventListener("change", () => {
            obstaclesMove = obstaclesMoveControl.checked;
            startObstacleTimer();
        });

        obstacleSpeedControl.addEventListener("input", () => {
            obstacleSpeed = parseInt(obstacleSpeedControl.value);
            obstacleSpeedValueEl.textContent = obstacleSpeed + "ms";
            startObstacleTimer();
        });

        fieldSizeControl.addEventListener("change", () => {
            const oldTileCount = tileCount;
            resizeCanvas();
            updateObstacleMax();
            // Schauen, ob Schlangenteile außerhalb liegen, falls ja, zurücksetzen
            const outOfBounds = snake.some(s => s.x >= tileCount || s.y >= tileCount);
            if(outOfBounds) {
                snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
                velocity = { x: 0, y: 0 };
                gameStarted = false;
                startHint.classList.remove("hidden");
                pauseHint.style.opacity = "0";
            }
            // Äpfel und Hindernisse neu filtern, die außerhalb liegen
            apples = apples.filter(a => a.x < tileCount && a.y < tileCount);
            while(apples.length < appleCount) spawnApple();
            obstacles = obstacles.filter(o => o.x < tileCount && o.y < tileCount);
            while(obstacles.length < obstacleCount) spawnObstacle();
        });

        randomColorControl.addEventListener("change", () => {
            randomColorEnabled = randomColorControl.checked;
            snakeColorControl.disabled = randomColorEnabled;
            snakeTailColorCtrl.disabled = randomColorEnabled;
            if (randomColorEnabled) {
                const [c1, c2] = generateDistinctColorPair();
                snakeColor = c1;
                snakeTailColor = c2;
            } else {
                snakeColor = snakeColorControl.value;
                snakeTailColor = snakeTailColorCtrl.value;
            }
        });

        connectionLineControl.addEventListener("change", () => {
            showConnectionLine = connectionLineControl.checked;
        });

        // Start des Spiels
        init();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
